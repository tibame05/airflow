version: '3.0'

services:
  # 初始化 Airflow 資料庫
  initdb:
    image: peiyuji/tibame_dataflow:${DOCKER_IMAGE_VERSION}
    command: pipenv run airflow db init
    restart: on-failure
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints: [node.labels.airflow==true]
    networks:
      - etf_lib_network

  # 建立 Airflow 使用者
  create-user:
    image: peiyuji/tibame_dataflow:${DOCKER_IMAGE_VERSION}
    command: pipenv run airflow users create --username admin --firstname lin --lastname sam --role Admin -p admin --email finmind.tw@gmail.com
    depends_on:
      - initdb
    restart: on-failure
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints: [node.labels.airflow==true]
    networks:
      - etf_lib_network

  redis:
    image: 'bitnami/redis:5.0'
    ports:
      - 6379:6379
    volumes:
      - 'redis_data:/bitnami/redis/data'
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
    restart: always
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints: [node.labels.airflow==true]
    networks:
      - etf_lib_network

  # Airflow Web UI
  webserver:
    image: peiyuji/tibame_dataflow:${DOCKER_IMAGE_VERSION}
    hostname: "airflow-webserver"
    command: pipenv run airflow webserver -p 5000
    depends_on:
      - initdb
      - redis
    restart: always
    ports:
      - 5000:5000
    environment:
      - TZ=Asia/Taipei
      - AIRFLOW__CORE__EXECUTOR=CeleryExecutor
      - AIRFLOW__CELERY__BROKER_URL=redis://redis:6379/0
      - AIRFLOW__CELERY__RESULT_BACKEND=redis://redis:6379/0
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints: [node.labels.airflow==true]
    networks:
      - etf_lib_network

  flower:
    image: mher/flower:0.9.5
    restart: always
    depends_on:
      - redis
    command: ["flower", "--broker=redis://redis:6379/0", "--port=5555"]
    ports:
      - "5556:5555"
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints: [node.labels.airflow==true]
    networks:
      - etf_lib_network

  # Scheduler
  scheduler:
    image: peiyuji/tibame_dataflow:${DOCKER_IMAGE_VERSION}
    hostname: "airflow-scheduler"
    command: pipenv run airflow scheduler
    depends_on:
      - initdb
      - redis
    restart: always
    environment:
      - TZ=Asia/Taipei
      - AIRFLOW__CORE__EXECUTOR=CeleryExecutor
      - AIRFLOW__CELERY__BROKER_URL=redis://redis:6379/0
      - AIRFLOW__CELERY__RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints: [node.labels.airflow==true]
    networks:
      - etf_lib_network

  # Worker
  worker:
    image: peiyuji/tibame_dataflow:${DOCKER_IMAGE_VERSION}
    hostname: "{{.Service.Name}}.{{.Task.Slot}}"
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - scheduler
      - redis
    command: pipenv run airflow celery worker
    environment:
      - TZ=Asia/Taipei
      - AIRFLOW__CORE__EXECUTOR=CeleryExecutor
      - AIRFLOW__CELERY__BROKER_URL=redis://redis:6379/0
      - AIRFLOW__CELERY__RESULT_BACKEND=redis://redis:6379/0
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints: [node.labels.worker==true]
    networks:
      - etf_lib_network

  # TWSE Worker
  crawler_twse:
    image: peiyuji/tibame_dataflow:${DOCKER_IMAGE_VERSION}
    hostname: "{{.Service.Name}}.{{.Task.Slot}}"
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - scheduler
      - redis
    command: pipenv run airflow celery worker -q twse
    environment:
      - TZ=Asia/Taipei
      - AIRFLOW__CORE__EXECUTOR=CeleryExecutor
      - AIRFLOW__CELERY__BROKER_URL=redis://redis:6379/0
      - AIRFLOW__CELERY__RESULT_BACKEND=redis://redis:6379/0
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints: [node.labels.airflow==true]
    networks:
      - etf_lib_network

  # TPEX Worker
  crawler_tpex:
    image: peiyuji/tibame_dataflow:${DOCKER_IMAGE_VERSION}
    hostname: "{{.Service.Name}}.{{.Task.Slot}}"
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - scheduler
      - redis
    command: pipenv run airflow celery worker -q tpex
    environment:
      - TZ=Asia/Taipei
      - AIRFLOW__CORE__EXECUTOR=CeleryExecutor
      - AIRFLOW__CELERY__BROKER_URL=redis://redis:6379/0
      - AIRFLOW__CELERY__RESULT_BACKEND=redis://redis:6379/0
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints: [node.labels.airflow==true]
    networks:
      - etf_lib_network

# 使用外部已建立好的 Docker Swarm 網路
networks:
  etf_lib_network:
    external: true

volumes:
  redis_data:
